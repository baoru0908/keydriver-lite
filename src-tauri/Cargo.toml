[package]
name = "keydriver-lite"
version = "0.1.0"
edition = "2021"

# Tauri v2 桌面外壳 + hidapi 原生 HID 桥（阶段 B）
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2.6"
objc2 = "0.6"
objc2-core-foundation = "0.3"

[profile.release]
opt-level = "s"      # 体积优先（阶段 B 目标 ~10M）
lto = true
strip = true
codegen-units = 1
panic = "abort"
