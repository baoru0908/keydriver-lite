<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="800" viewBox="0 0 1320 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12131a"/>
      <stop offset="55%" stop-color="#101014"/>
      <stop offset="100%" stop-color="#0b0b0f"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.28" cy="0.42" r="0.55">
      <stop offset="0%" stop-color="#4dd4c0" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#4dd4c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.76" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#4d8fd4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#4d8fd4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4dd4c0" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#4dd4c0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4dd4c0" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid" width="66" height="66" patternUnits="userSpaceOnUse">
      <path d="M66 0 L0 0 0 66" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1320" height="800" fill="url(#bg)"/>
  <rect width="1320" height="800" fill="url(#grid)"/>
  <rect width="1320" height="800" fill="url(#glowA)"/>
  <rect width="1320" height="800" fill="url(#glowB)"/>

  <!-- 键帽剪影装饰（右下，极低对比） -->
  <g opacity="0.07" transform="translate(880 520) rotate(-8)">
    <g fill="#ffffff">
      <rect x="0"   y="0"   width="72" height="72" rx="14"/>
      <rect x="86"  y="0"   width="72" height="72" rx="14"/>
      <rect x="172" y="0"   width="72" height="72" rx="14"/>
      <rect x="43"  y="86"  width="72" height="72" rx="14"/>
      <rect x="129" y="86"  width="72" height="72" rx="14"/>
      <rect x="215" y="86"  width="72" height="72" rx="14"/>
      <rect x="86"  y="172" width="72" height="72" rx="14"/>
      <rect x="172" y="172" width="72" height="72" rx="14"/>
    </g>
  </g>

  <!-- 拖拽指示箭头：左（App）→ 右（Applications） -->
  <g transform="translate(470 430)">
    <path d="M0 0 H300" stroke="url(#arrow)" stroke-width="7" stroke-linecap="round" stroke-dasharray="18 14"/>
    <path d="M300 -18 L344 0 L300 18 Z" fill="#4dd4c0" opacity="0.95"/>
    <circle cx="0" cy="0" r="9" fill="#4dd4c0" opacity="0.55"/>
  </g>

  <g font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="130" y="120" font-size="46" font-weight="700" fill="#f5f6f8">KeyDriver Lite</text>
    <text x="130" y="168" font-size="24" fill="#9aa3b2">键盘配置工具 · 原生 HID · 3.5 MB</text>
    <text x="130" y="660" font-size="23" fill="#8b94a3">把左侧图标拖进 Applications 即完成安装</text>
    <text x="130" y="700" font-size="19" fill="#5f6773">macOS 12+ · Apple Silicon</text>
  </g>
</svg>
